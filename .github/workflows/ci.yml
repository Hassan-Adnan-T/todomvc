name: CI React

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Remove old lockfile and node_modules
        run: |
          rm -f package-lock.json
          rm -rf node_modules
      
      - name: Install dependencies (bypass PhantomJS)
        run: npm install --legacy-peer-deps --omit=optional --ignore-scripts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      
      - name: Install Cypress
        run: npx cypress install
      
      - name: Start the application
        run: |
          cd examples/react
          npm start &
          sleep 15
        env:
          CI: true
      
      - name: Run Cypress tests
        run: |
          cd examples/react
          npx cypress run --headless --config baseUrl=http://localhost:8080
        env:
          CI: true